apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-kubernetes-reader
  namespace: external-secrets-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-read-secrets
  namespace: secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-kubernetes-reader
  namespace: secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-read-secrets
subjects:
  - kind: ServiceAccount
    name: eso-kubernetes-reader
    namespace: external-secrets-operator

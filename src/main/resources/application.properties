quarkus.application.name=observability-demo

# JSON structured logs
quarkus.log.console.json.enabled=true
quarkus.log.level=INFO
quarkus.log.category."com.example.obsdemo".level=${QUARKUS_LOG_LEVEL:INFO}

# Prometheus metrics on /q/metrics
quarkus.micrometer.export.prometheus.enabled=true

# Health endpoints
quarkus.smallrye-health.root-path=/q/health

# OpenTelemetry — OTLP endpoint overridable via env in OpenShift
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=observability-demo
